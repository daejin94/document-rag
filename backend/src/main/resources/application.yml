spring:
  application:
    name: document-rag
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rag_db}
    username: ${SPRING_DATASOURCE_USERNAME:rag_user}
    password: ${SPRING_DATASOURCE_PASSWORD:rag_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  # 구글 OAuth(spring.security.oauth2.client.registration.google.*) 설정은 application.yml에 두지 않는다.
  # registration 키가 하나라도 존재하면(client-id가 비어 있어도) Spring이 OAuth2ClientProperties를
  # 검증하다 부팅이 실패하기 때문이다. 자격증명은 환경변수로만 주입한다(.env.example 참고).

server:
  error:
    include-message: never

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-to-at-least-32-bytes}
    access-token-minutes: 120
  admin:
    super-admin-email: ${SUPER_ADMIN_EMAIL:}
  oauth:
    # OAuth 로그인 완료 후 사용자를 돌려보낼 프론트엔드 주소
    frontend-url: ${OAUTH_FRONTEND_URL:http://localhost:5173/}
  storage:
    root: ${FILE_STORAGE_ROOT:./uploads}
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com}
    chat-model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
    embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
  rag:
    chunk-size: ${RAG_CHUNK_SIZE:800}
    chunk-overlap: ${RAG_CHUNK_OVERLAP:150}
    top-k: ${RAG_TOP_K:5}
    similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.70}
